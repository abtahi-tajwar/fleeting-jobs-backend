spring.application.name=fleeting-jobs-backend

# Postgres configurations
spring.datasource.url=jdbc:postgresql://localhost:5432/fleeting_jobs
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#worker configuration
worker.base-url=http://localhost:8000

#rabbitmq configuraiton
spring.rabbitmq.host: localhost
spring.rabbitmq.port: 5672
spring.rabbitmq.username: ${RABBIT_USERNAME}
spring.rabbitmq.password: ${RABBIT_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.main.allow-circular-references=true
logging.level.org.springframework.security=DEBUG
