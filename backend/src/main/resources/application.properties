spring.application.name=fleeting-jobs-backend

# Postgres configurations
spring.datasource.url=jdbc:postgresql://localhost:5432/fleeting_jobs
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#worker configuration
worker.base-url=http://localhost:8000

#rabbitmq configuraiton
spring.rabbitmq.host: localhost
spring.rabbitmq.port: 5672
spring.rabbitmq.username: ${RABBIT_USERNAME}
spring.rabbitmq.password: ${RABBIT_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.main.allow-circular-references=true
logging.level.org.springframework.security=DEBUG

# App URLs (confirmation email links)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}

# Mailtrap SMTP (testing)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@fleetingjobs.test}

# OAuth (signup with Google / LinkedIn)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
oauth.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
